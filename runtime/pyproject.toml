[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morning-star-runtime"
version = "0.2.0"
description = "Reference runtime for the Morning Star constitutional architecture."
requires-python = ">=3.11"
authors = [
  { name = "Ashley S. Harris" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "mypy>=1.10"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "0.2.0"
strict = true
warn_unused_configs = true

